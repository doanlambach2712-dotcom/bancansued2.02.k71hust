<script>
// Danh sách 3 sinh viên được phép truy cập
const ALLOWED_NAMES = [
  "DOAN LAM BACH",
  "NGUYEN KHANH LY",
  "TO BAO NGAN"
];

// Hàm loại bỏ dấu tiếng Việt chuẩn xác
function removeVietnameseTones(str) {
  if (!str) return "";
  return str.normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd').replace(/Đ/g, 'D')
            .trim();
}

function handleAuth(e) {
  e.preventDefault();
  
  const fullNameInput = document.getElementById('fullName').value.trim();
  const studentIdInput = document.getElementById('studentId').value.trim();
  const dobInput = document.getElementById('dob').value;
  const alertBox = document.getElementById('alertBox');

  alertBox.style.display = 'none';
  alertBox.className = 'alert';

  // Chuẩn hóa tên nhập vào (bỏ dấu và viết hoa)
  const normalizedInputName = removeVietnameseTones(fullNameInput).toUpperCase();

  // Kiểm tra tên có chính xác nằm trong danh sách hay không
  const isAuthorized = ALLOWED_NAMES.includes(normalizedInputName);

  if (isAuthorized && studentIdInput !== "" && dobInput !== "") {
    // TRƯỜNG HỢP ĐÚNG
    alertBox.className = 'alert alert-success';
    alertBox.innerHTML = `<strong>Xác thực thành công!</strong><br>Chào mừng <strong>${fullNameInput}</strong>. Đang chuyển hướng...`;
    alertBox.style.display = 'block';

    // Lưu trạng thái đăng nhập
    localStorage.setItem('class_access_granted', 'true');
    localStorage.setItem('user_fullname', fullNameInput);
    localStorage.setItem('user_studentid', studentIdInput);

    // Chuyển hướng chuẩn xác sau 1.2 giây
    setTimeout(() => {
      window.location.href = "index.html";
    }, 1200);

  } else {
    // TRƯỜNG HỢP SAI HẶC KHÔNG CÓ TRONG DANH SÁCH
    alertBox.className = 'alert alert-error';
    alertBox.innerHTML = '<strong>Hệ thống báo: Không có quyền truy cập!</strong><br>Thông tin của bạn không nằm trong danh sách được phép vào hệ thống. Vui lòng kiểm tra lại thông tin hoặc liên hệ Ban cán sự lớp.';
    alertBox.style.display = 'block';
  }
}
</script>
